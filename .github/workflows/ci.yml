name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # only runs the ruff binary
      - name: Install ruff (version pinned in requirements.txt)
        run: pip install "$(grep '^ruff==' requirements.txt)"
      - run: ruff check --output-format=github .

  test:
    name: Mypy + pytest
    # requirements.txt is locked for macOS arm64, so the tests run there.
    runs-on: macos-latest
    env:
      # No model downloads in CI: tests use synthetic signals and fake models,
      # so any attempt to reach the Hugging Face Hub must fail fast.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the locked environment
        run: pip install -r requirements.txt
      - run: mypy
      - name: pytest (coverage gate on tester/metrics)
        run: pytest --cov=tester/metrics --cov-report=term-missing --cov-fail-under=80
